<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Camera Sharing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 450px;
    margin: 40px auto;
    background: #1c293b;
    padding: 25px;
    border-radius: 18px;
}

h1 {
    color: #00d4ff;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #00bfff;
    color: #00111a;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border-radius: 8px;
    border: none;
}

video {
    width: 100%;
    margin-top: 20px;
    background: black;
    border-radius: 12px;
}

.status {
    color: #00e5a8;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📷 Remote Camera</h1>
<p>Secure camera sharing system</p>

<div id="ownerPanel">
    <h3>Create Sharing Room</h3>
    <button onclick="createRoom()">Generate Link</button>

    <input id="shareLink" readonly
    placeholder="Your sharing link appears here">

    <button onclick="shareWhatsApp()">Share on WhatsApp</button>
</div>

<div id="guestPanel" style="display:none">
    <h3>Camera Sharing Request</h3>
    <p>Approve camera access to share your live video.</p>

    <button onclick="startCamera()">Allow Camera & Start Sharing</button>

    <video id="camera" autoplay playsinline muted></video>

    <button onclick="stopCamera()">Stop Sharing</button>
</div>

<p class="status" id="status">System Ready</p>

</div>

<script>

let cameraStream = null;

const params = new URLSearchParams(location.search);
const room = params.get("room");

if (room) {
    document.getElementById("ownerPanel").style.display = "none";
    document.getElementById("guestPanel").style.display = "block";
}

function createRoom() {

    const roomID = crypto.randomUUID();

    const link = location.origin +
        location.pathname + "?room=" + roomID;

    document.getElementById("shareLink").value = link;

    document.getElementById("status").innerText =
        "Sharing room created!";
}

function shareWhatsApp() {

    const link = document.getElementById("shareLink").value;

    if (!link) {
        alert("Generate a link first!");
        return;
    }

    const message = encodeURIComponent(
        "Open this link to share your camera with me: " + link
    );

    window.open(
        "https://wa.me/?text=" + message,
        "_blank"
    );
}

async function startCamera() {

    try {

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        document.getElementById("camera").srcObject =
            cameraStream;

        document.getElementById("status").innerText =
            "Camera sharing active locally.";

    } catch (error) {

        document.getElementById("status").innerText =
            "Camera permission denied or unavailable.";

    }
}

function stopCamera() {

    if (cameraStream) {

        cameraStream.getTracks().forEach(track => track.stop());

        cameraStream = null;

        document.getElementById("camera").srcObject = null;

        document.getElementById("status").innerText =
            "Camera sharing stopped.";
    }
}

</script>

</body>
</html>
